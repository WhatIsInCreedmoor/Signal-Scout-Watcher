name: Build & Release Watcher Firmware

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (blank = current branch/tag)'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Publish GitHub Release assets (auto-enabled on tags)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Build Ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Determine Target Ref & Release Mode
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            REF="${{ github.ref_name }}"
            TAG="${{ github.ref_name }}"
            SHOULD_RELEASE="true"
          else
            REQ_TAG="${{ github.event.inputs.tag }}"
            if [[ -n "${REQ_TAG}" ]]; then
              REF="${REQ_TAG}"
              TAG="${REQ_TAG}"
              SHOULD_RELEASE="true"
            elif [[ "${{ github.ref_type }}" == "tag" ]]; then
              REF="${{ github.ref_name }}"
              TAG="${{ github.ref_name }}"
              SHOULD_RELEASE="true"
            else
              REF="${{ github.ref_name }}"
              TAG="${{ github.ref_name }}"
              SHOULD_RELEASE="${{ github.event.inputs.publish_release }}"
            fi
          fi
          {
            echo "ref=${REF}"
            echo "tag=${TAG}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c3, esp32c5, esp32c6, esp32s3]
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Signal-Scout-Watcher
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Build & Merge Firmware (${{ matrix.target }})
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eo pipefail
          source "${IDF_PATH}/export.sh"
          set -u
          idf.py set-target "${TARGET}"
          idf.py build
          idf.py size
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          VER="${RELEASE_TAG#[vV]}"
          OUT_BIN="${GITHUB_WORKSPACE}/dist/${VER}-${TARGET}.bin"
          (cd build && python -m esptool --chip "${TARGET}" merge_bin -o "${OUT_BIN}" @flash_args)

      - name: Upload Merged Binary (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Target Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh release-assets/
          TAG="${{ needs.prepare.outputs.tag }}"
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/*.bin --repo "${GH_REPO}" --clobber
            gh release edit "${TAG}" --repo "${GH_REPO}" --latest
          else
            gh release create "${TAG}" release-assets/*.bin \
              --repo "${GH_REPO}" \
              --target "${{ needs.prepare.outputs.ref }}" \
              --title "Signal Scout Watcher ${TAG}" \
              --latest \
              --generate-notes
          fi

      - name: Notify Signal-Scout-Web-Flasher (Optional)
        env:
          DISPATCH_TOKEN: ${{ secrets.WEB_FLASHER_DISPATCH_TOKEN }}
        run: |
          if [[ -n "${DISPATCH_TOKEN}" ]]; then
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/WhatIsInCreedmoor/Signal-Scout-Web-Flasher/dispatches" \
              -d "{\"event_type\":\"watcher-tag-updated\",\"client_payload\":{\"tag\":\"${{ needs.prepare.outputs.tag }}\"}}"
          else
            echo "WEB_FLASHER_DISPATCH_TOKEN secret not set; skipping instant webhook."
          fi

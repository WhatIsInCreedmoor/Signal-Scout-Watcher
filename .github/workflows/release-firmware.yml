name: Build & Release Watcher Firmware

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (blank = current branch/tag)'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Publish GitHub Release assets (auto-enabled on tags)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Build Ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Determine Target Ref & Release Mode
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            REF="${{ github.ref_name }}"
            TAG="${{ github.ref_name }}"
            SHOULD_RELEASE="true"
          else
            REQ_TAG="${{ github.event.inputs.tag }}"
            if [[ -n "${REQ_TAG}" ]]; then
              REF="${REQ_TAG}"
              TAG="${REQ_TAG}"
              SHOULD_RELEASE="true"
            elif [[ "${{ github.ref_type }}" == "tag" ]]; then
              REF="${{ github.ref_name }}"
              TAG="${{ github.ref_name }}"
              SHOULD_RELEASE="true"
            else
              REF="${{ github.ref_name }}"
              TAG="${{ github.ref_name }}"
              SHOULD_RELEASE="${{ github.event.inputs.publish_release }}"
            fi
          fi
          {
            echo "ref=${REF}"
            echo "tag=${TAG}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c3, esp32c5, esp32c6, esp32s3]
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Signal-Scout-Watcher
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Build & Package (${{ matrix.target }})
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eo pipefail
          source "${IDF_PATH}/export.sh"
          set -u
          export COMMIT_SHA="$(git rev-parse HEAD)"
          idf.py set-target "${TARGET}"
          idf.py build
          idf.py size
          python3 - <<'PY'
          import json, os, shutil, struct, zipfile

          target = os.environ["TARGET"]
          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["COMMIT_SHA"]
          families = {"esp32c3": "ESP32-C3", "esp32c5": "ESP32-C5", "esp32c6": "ESP32-C6", "esp32s3": "ESP32-S3"}

          with open("build/flasher_args.json", "r", encoding="utf-8") as f:
              args = json.load(f)

          out_dir = f"dist/raw/{target}"
          os.makedirs(out_dir, exist_ok=True)

          parts = []
          app_file = os.path.basename(args.get("app", {}).get("file", ""))
          app_size = 0
          for offset_hex, rel_path in sorted(args["flash_files"].items(), key=lambda kv: int(kv[0], 16)):
              src = os.path.join("build", rel_path)
              name = os.path.basename(rel_path)
              dst = os.path.join(out_dir, name)
              shutil.copy2(src, dst)
              size = os.path.getsize(dst)
              offset = int(offset_hex, 16)
              if name == app_file:
                  app_size = size
              parts.append({"path": f"{target}/{name}", "file": name, "offset": offset, "offset_hex": hex(offset), "size": size})

          nvs = None
          ptable_rel = args.get("partition-table", {}).get("file", "")
          ptable_path = os.path.join("build", ptable_rel) if ptable_rel else ""
          if ptable_path and os.path.exists(ptable_path):
              raw = open(ptable_path, "rb").read()
              for pos in range(0, len(raw) - 31, 32):
                  magic, ptype, psub, offset, size, label_raw, _ = struct.unpack("<HBBII16sI", raw[pos:pos + 32])
                  if magic != 0x50AA:
                      break
                  label = label_raw.split(b"\x00", 1)[0].decode("utf-8", errors="ignore")
                  if (ptype == 1 and psub == 2) or label == "nvs":
                      nvs = {"offset": offset, "offset_hex": hex(offset), "size": size, "size_hex": hex(size)}
                      break

          meta = {
              "target": target,
              "chipFamily": families.get(target, target.upper()),
              "tag": tag,
              "commit": commit,
              "flash_settings": args.get("flash_settings", {}),
              "nvs": nvs,
              "app_file": app_file,
              "app_size": app_size,
              "parts": parts,
          }
          with open(os.path.join(out_dir, "meta.json"), "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")

          os.makedirs("dist/assets", exist_ok=True)
          zip_path = f"dist/assets/signal-scout-watcher-{tag}-{target}.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for fname in sorted(os.listdir(out_dir)):
                  zf.write(os.path.join(out_dir, fname), arcname=fname)
          PY

      - name: Upload Target Artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            dist/raw/${{ matrix.target }}/meta.json
            dist/assets/signal-scout-watcher-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Target Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: staging

      - name: Build Release Metadata Index
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p release-assets
          find staging -name 'signal-scout-watcher-*.zip' -exec cp {} release-assets/ \;
          python3 - <<'PY'
          import glob, json, os

          tag = os.environ["RELEASE_TAG"]
          by_target = {}
          for path in glob.glob("staging/**/meta.json", recursive=True):
              m = json.load(open(path, "r", encoding="utf-8"))
              by_target[m["target"]] = m

          commit = next((m.get("commit", "") for m in by_target.values() if m.get("commit")), os.environ["COMMIT_SHA"])
          order = ["esp32c3", "esp32c5", "esp32c6", "esp32s3"]
          targets = {}
          for t in [x for x in order if x in by_target] + sorted(x for x in by_target if x not in order):
              m = by_target[t]
              targets[t] = {
                  "chipFamily": m["chipFamily"],
                  "asset": f"signal-scout-watcher-{tag}-{t}.zip",
                  "app_file": m.get("app_file", ""),
                  "app_size": m.get("app_size", 0),
                  "flash_settings": m.get("flash_settings", {}),
                  "nvs": m.get("nvs"),
                  "parts": m["parts"],
              }

          with open("release-assets/release-metadata.json", "w", encoding="utf-8") as f:
              json.dump({"name": "Signal Scout Watcher", "tag": tag, "commit": commit, "targets": targets}, f, indent=2)
              f.write("\n")
          PY
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
            gh release edit "${TAG}" --latest
          else
            gh release create "${TAG}" release-assets/* \
              --title "Signal Scout Watcher ${TAG}" \
              --latest \
              --generate-notes
          fi

      - name: Notify Signal-Scout-Web-Flasher (Optional)
        env:
          DISPATCH_TOKEN: ${{ secrets.WEB_FLASHER_DISPATCH_TOKEN }}
        run: |
          if [[ -n "${DISPATCH_TOKEN}" ]]; then
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/WhatIsInCreedmoor/Signal-Scout-Web-Flasher/dispatches" \
              -d "{\"event_type\":\"watcher-tag-updated\",\"client_payload\":{\"tag\":\"${{ needs.prepare.outputs.tag }}\"}}"
          else
            echo "WEB_FLASHER_DISPATCH_TOKEN secret not set; skipping instant webhook."
          fi
